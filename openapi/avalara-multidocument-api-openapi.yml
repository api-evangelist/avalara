        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: code
        in: path
        schema:
          type: string
        required: true
      - name: type
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: getApiV2TransactionsMultidocumentByCodeTypeByType
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
  /api/v2/transactions/multidocument/{id}:
    get:
      tags:
      - MultiDocument
      summary: Avalara GetMultiDocumentTransactionById
      description: 'Get the unique MultiDocument transaction identified by this URL.


        A traditional transaction requires exactly two parties: a seller and a buyer. MultiDocument transactions can

        involve a marketplace of vendors, each of which contributes some portion of the final transaction. Within

        a MultiDocument transaction, each individual buyer and seller pair are matched up and converted to a separate

        document. This separation of documents allows each seller to file their taxes separately.


        This endpoint retrieves the exact transaction identified by this ID number even if that transaction was later adjusted

        by using the `AdjustTransaction` endpoint.


        A transaction represents a unique potentially taxable action that your company has recorded, and transactions include actions like

        sales, purchases, inventory transfer, and returns (also called refunds).


        You may specify one or more of the following values in the `$include` parameter to fetch additional nested data, using commas to separate multiple values:


        * Lines

        * Details (implies lines)

        * Summary (implies details)

        * Addresses

        * SummaryOnly (omit lines and details - reduces API response size)

        * LinesOnly (omit details - reduces API response size)


        NOTE: If your companyCode or transactionCode contains any of these characters /, +, ? or a space please use the following encoding before making a request:

        * Replace ''/'' with ''\_-ava2f-\_'' For example: document/Code becomes document_-ava2f-_Code

        * Replace ''+'' with ''\_-ava2b-\_'' For example: document+Code becomes document_-ava2b-_Code

        * Replace ''?'' with ''\_-ava3f-\_'' For example: document?Code becomes document_-ava3f-_Code

        * Replace ''%'' with ''\_-ava25-\_'' For example: document%Code becomes document_-ava25-_Code

        * Replace ''#'' with ''\_-ava23-\_'' For example: document#Code becomes document_-ava23-_Code

        * Replace '' '' with ''%20'' For example: document Code becomes document%20Code


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPAdmin, CSPTester, ProStoresOperator, SiteAdmin, SSTAdmin, SystemAdmin, TechnicalSupportAdmin, TechnicalSupportUser.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      parameters:
      - name: X-Avalara-Client
