openapi: 3.2.0
info:
  title: Avalara Multi Document API
  version: '1.0'
  description: 'Operations tagged MultiDocument across 2 of this provider''s published API definitions: avalara-avatax-rest-openapi.yml, avatax-apis-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://rest.avatax.com
  description: AvaTax Production
- url: https://sandbox-rest.avatax.com
  description: AvaTax Sandbox
- url: http://{{baseurl}}
tags:
- name: MultiDocument
  description: Multi-document transaction management
paths:
  /api/v2/multidocument/transactions/create:
    post:
      operationId: createMultiDocumentTransaction
      summary: Avalara Create a Multi-document Transaction
      description: Creates a transaction that spans multiple companies or jurisdictions, managing related documents as a single group.
      tags:
      - MultiDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMultiDocumentModel'
      responses:
        '200':
          description: Multi-document transaction created
      security:
      - basicAuth: []
      - bearerAuth: []
    servers:
    - url: https://rest.avatax.com
      description: AvaTax Production
    - url: https://sandbox-rest.avatax.com
      description: AvaTax Sandbox
  /api/v2/transactions/multidocument/{code}/type/{type}/adjust:
    post:
      tags:
      - MultiDocument
      summary: Avalara AdjustMultiDocumentTransaction
      description: 'Adjusts the current MultiDocument transaction uniquely identified by this URL.


        A transaction represents a unique potentially taxable action that your company has recorded, and transactions include actions like

        sales, purchases, inventory transfer, and returns (also called refunds).


        When you adjust a transaction, that transaction''s status is recorded as `Adjusted`.


        Both the revisions will be available for retrieval based on their code and ID numbers. Only transactions in Committed status can be reported on a tax filing by Avalara''s Managed Returns Service.


        Transactions that have been previously reported to a tax authority by Avalara Managed Returns are considered locked and are no longer available for adjustments.


        NOTE: If your companyCode or transactionCode contains any of these characters /, +, ? or a space please use the following encoding before making a request:

        * Replace ''/'' with ''\_-ava2f-\_'' For example: document/Code becomes document_-ava2f-_Code

        * Replace ''+'' with ''\_-ava2b-\_'' For example: document+Code becomes document_-ava2b-_Code

        * Replace ''?'' with ''\_-ava3f-\_'' For example: document?Code becomes document_-ava3f-_Code

        * Replace ''%'' with ''\_-ava25-\_'' For example: document%Code becomes document_-ava25-_Code

        * Replace ''#'' with ''\_-ava23-\_'' For example: document#Code becomes document_-ava23-_Code

        * Replace '' '' with ''%20'' For example: document Code becomes document%20Code


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, BatchServiceAdmin, CompanyAdmin, CSPTester, SSTAdmin, TechnicalSupportAdmin, TechnicalSupportUser.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                adjustmentReason: PriceAdjusted
                adjustDescription: Price was dropped.
                newTransaction:
                  lines:
                  - companyCode: DEFAULT
                    reportingLocationCode: ReportLocation111
                    number: '1'
                    quantity: 1
                    amount: 100
                    taxCode: PS081282
                    itemCode: Y0001
                    description: Yarn
                  type: SalesInvoice
                  companyCode: DEFAULT
                  date: '2023-08-13'
                  customerCode: ABC
                  purchaseOrderNo: 2023-08-13-001
                  addresses:
                    singleLocation:
                      line1: 2000 Main Street
                      city: Irvine
                      region: CA
                      country: US
                      postalCode: '92614'
                  commit: true
                  currencyCode: USD
                  description: Yarn
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: code
        in: path
        schema:
          type: string
        required: true
      - name: type
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: postApiV2TransactionsMultidocumentByCodeTypeByTypeAdjust
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
  /api/v2/transactions/multidocument/{code}/type/{type}/audit:
    get:
      tags:
      - MultiDocument
      summary: Avalara AuditMultiDocumentTransaction
      description: 'Retrieve audit information about a MultiDocument transaction stored in AvaTax.


        The audit API retrieves audit information related to a specific MultiDocument transaction. This audit

        information includes the following:


        * The `code` of the MultiDocument transaction

        * The `type` of the MultiDocument transaction

        * The server timestamp representing the exact server time when the transaction was created

        * The server duration - how long it took to process this transaction

        * Whether exact API call details were logged

        * A reconstructed API call showing what the original create call looked like


        A transaction represents a unique potentially taxable action that your company has recorded, and transactions include actions like

        sales, purchases, inventory transfer, and returns (also called refunds).


        NOTE: If your companyCode or transactionCode contains any of these characters /, +, ? or a space please use the following encoding before making a request:

        * Replace ''/'' with ''\_-ava2f-\_'' For example: document/Code becomes document_-ava2f-_Code

        * Replace ''+'' with ''\_-ava2b-\_'' For example: document+Code becomes document_-ava2b-_Code

        * Replace ''?'' with ''\_-ava3f-\_'' For example: document?Code becomes document_-ava3f-_Code

        * Replace ''%'' with ''\_-ava25-\_'' For example: document%Code becomes document_-ava25-_Code

        * Replace ''#'' with ''\_-ava23-\_'' For example: document#Code becomes document_-ava23-_Code

        * Replace '' '' with ''%20'' For example: document Code becomes document%20Code


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPAdmin, CSPTester, ProStoresOperator, SiteAdmin, SSTAdmin, SystemAdmin, TechnicalSupportAdmin, TechnicalSupportUser.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: code
        in: path
        schema:
          type: string
        required: true
      - name: type
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: getApiV2TransactionsMultidocumentByCodeTypeByTypeAudit
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
  /api/v2/transactions/multidocument/commit:
    post:
      tags:
      - MultiDocument
      summary: Avalara CommitMultiDocumentTransaction
      description: 'Marks a list of transactions by changing its status to `Committed`.


        Transactions that are committed are available to be reported to a tax authority by Avalara Managed Returns.


        A transaction represents a unique potentially taxable action that your company has recorded, and transactions include actions like

        sales, purchases, inventory transfer, and returns (also called refunds).


        Any changes made to a committed transaction will generate a transaction history.


        NOTE: If your companyCode or transactionCode contains any of these characters /, +, ? or a space please use the following encoding before making a request:

        * Replace ''/'' with ''\_-ava2f-\_'' For example: document/Code becomes document_-ava2f-_Code

        * Replace ''+'' with ''\_-ava2b-\_'' For example: document+Code becomes document_-ava2b-_Code

        * Replace ''?'' with ''\_-ava3f-\_'' For example: document?Code becomes document_-ava3f-_Code

        * Replace ''%'' with ''\_-ava25-\_'' For example: document%Code becomes document_-ava25-_Code

        * Replace ''#'' with ''\_-ava23-\_'' For example: document#Code becomes document_-ava23-_Code

        * Replace '' '' with ''%20'' For example: document Code becomes document%20Code


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, ProStoresOperator, SSTAdmin, TechnicalSupportAdmin.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                code: b7ea8db8-42f7-40db-8592-d31ed6c5cb6c
                type: SalesInvoice
                commit: true
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: postApiV2TransactionsMultidocumentCommit
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
  /api/v2/transactions/multidocument:
    post:
      tags:
      - MultiDocument
      summary: Avalara CreateMultiDocumentTransaction
      description: 'Records a new MultiDocument transaction in AvaTax.


        A traditional transaction requires exactly two parties: a seller and a buyer. MultiDocument transactions can

        involve a marketplace of vendors, each of which contributes some portion of the final transaction. Within

        a MultiDocument transaction, each individual buyer and seller pair are matched up and converted to a separate

        document. This separation of documents allows each seller to file their taxes separately.


        This API will report an error if you attempt to create a transaction when one already exists with the specified `code`.

        If you would like the API to automatically update the transaction when it already exists, please set the `allowAdjust`

        value to `true`.


        To generate a refund for a transaction, use the `RefundTransaction` API.


        The field `type` identifies the kind of transaction - for example, a sale, purchase, or refund. If you do not specify

        a `type` value, you will receive an estimate of type `SalesOrder`, which will not be recorded.


        The origin and destination locations for a transaction must be identified by either address or geocode. For address-based transactions, please

        provide addresses in the fields `line`, `city`, `region`, `country` and `postalCode`. For geocode-based transactions, please provide the geocode

        information in the fields `latitude` and `longitude`. If either `latitude` or `longitude` or both are null, the transaction will be calculated

        using the best available address location information.


        You may specify one or more of the following values in the `$include` parameter to fetch additional nested data, using commas to separate multiple values:


        * Lines

        * Details (implies lines)

        * Summary (implies details)

        * Addresses

        * SummaryOnly (omit lines and details - reduces API response size)

        * LinesOnly (omit details - reduces API response size)

        * ForceTimeout - Simulates a timeout. This adds a 30 second delay and error to your API call. This can be used to test your code to ensure it can respond correctly in the case of a dropped connection.


        If you omit the `$include` parameter, the API will assume you want `Summary,Addresses`.


        NOTE: If your companyCode or transactionCode contains any of these characters /, +, ? or a space please use the following encoding before making a request:

        * Replace ''/'' with ''\_-ava2f-\_'' For example: document/Code becomes document_-ava2f-_Code

        * Replace ''+'' with ''\_-ava2b-\_'' For example: document+Code becomes document_-ava2b-_Code

        * Replace ''?'' with ''\_-ava3f-\_'' For example: document?Code becomes document_-ava3f-_Code

        * Replace ''%'' with ''\_-ava25-\_'' For example: document%Code becomes document_-ava25-_Code

        * Replace ''#'' with ''\_-ava23-\_'' For example: document#Code becomes document_-ava23-_Code

        * Replace '' '' with ''%20'' For example: document Code becomes document%20Code


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin, TechnicalSupportUser.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                lines:
                - companyCode: DEFAULT
                  reportingLocationCode: ReportLocation111
                  number: '1'
                  quantity: 1
                  amount: 100
                  taxCode: PS081282
                  itemCode: Y0001
                  description: Yarn
                type: SalesInvoice
                companyCode: DEFAULT
                date: '2023-08-13'
                customerCode: ABC
                purchaseOrderNo: 2023-08-13-001
                addresses:
                  singleLocation:
                    line1: 2000 Main Street
                    city: Irvine
                    region: CA
                    country: US
                    postalCode: '92614'
                commit: true
                currencyCode: USD
                description: Yarn
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: postApiV2TransactionsMultidocument
      x-operation-id-source: derived
    get:
      tags:
      - MultiDocument
      summary: Avalara ListMultiDocumentTransactions
      description: 'List all MultiDocument transactions within this account.


        This endpoint is limited to returning 1,000 MultiDocument transactions at a time. To retrieve more than 1,000 MultiDocument

        transactions, please use the pagination features of the API.


        A transaction represents a unique potentially taxable action that your company has recorded, and transactions include actions like

        sales, purchases, inventory transfer, and returns (also called refunds).


        Search for specific objects using the criteria in the `$filter` parameter; full documentation is available on Filtering in REST .

        Paginate your results using the `$top`, `$skip`, and `$orderby` parameters.


        You may specify one or more of the following values in the `$include` parameter to fetch additional nested data, using commas to separate multiple values:


        * Lines

        * Details (implies lines)

        * Summary (implies details)

        * Addresses

        * SummaryOnly (omit lines and details - reduces API response size)

        * LinesOnly (omit details - reduces API response size)


        NOTE: If your companyCode or transactionCode contains any of these characters /, +, ? or a space please use the following encoding before making a request:

        * Replace ''/'' with ''\_-ava2f-\_'' For example: document/Code becomes document_-ava2f-_Code

        * Replace ''+'' with ''\_-ava2b-\_'' For example: document+Code becomes document_-ava2b-_Code

        * Replace ''?'' with ''\_-ava3f-\_'' For example: document?Code becomes document_-ava3f-_Code

        * Replace ''%'' with ''\_-ava25-\_'' For example: document%Code becomes document_-ava25-_Code

        * Replace ''#'' with ''\_-ava23-\_'' For example: document#Code becomes document_-ava23-_Code

        * Replace '' '' with ''%20'' For example: document Code becomes document%20Code


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPAdmin, CSPTester, ProStoresOperator, SiteAdmin, SSTAdmin, SystemAdmin, TechnicalSupportAdmin, TechnicalSupportUser.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: getApiV2TransactionsMultidocument
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
  /api/v2/transactions/multidocument/{code}/type/{type}:
    get:
      tags:
      - MultiDocument
      summary: Avalara GetMultiDocumentTransactionByCodeAndType
      description: 'Get the current MultiDocument transaction identified by this URL.


        If this transaction was adjusted, the return value of this API will be the current transaction with this code.


        You may specify one or more of the following values in the `$include` parameter to fetch additional nested data, using commas to separate multiple values:


        * Lines

        * Details (implies lines)

        * Summary (implies details)

        * Addresses

        * SummaryOnly (omit lines and details - reduces API response size)

        * LinesOnly (omit details - reduces API response size)


        NOTE: If your companyCode or transactionCode contains any of these characters /, +, ? or a space please use the following encoding before making a request:

        * Replace ''/'' with ''\_-ava2f-\_'' For example: document/Code becomes document_-ava2f-_Code

        * Replace ''+'' with ''\_-ava2b-\_'' For example: document+Code becomes document_-ava2b-_Code

        * Replace ''?'' with ''\_-ava3f-\_'' For example: document?Code becomes document_-ava3f-_Code

        * Replace ''%'' with ''\_-ava25-\_'' For example: document%Code becomes document_-ava25-_Code

        * Replace ''#'' with ''\_-ava23-\_'' For example: document#Code becomes document_-ava23-_Code

        * Replace '' '' with ''%20'' For example: document Code becomes document%20Code


