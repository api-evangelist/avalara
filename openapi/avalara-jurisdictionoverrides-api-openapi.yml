openapi: 3.2.0
info:
  title: Avalara AvaTax Jurisdiction Overrides API
  description: Welcome to the AvaTax API Postman Collection!
  version: 1.0.0
servers:
- url: http://{{baseurl}}
security:
- basicAuth: []
tags:
- name: JurisdictionOverrides
paths:
  /api/v2/accounts/{accountId}/jurisdictionoverrides:
    post:
      tags:
      - JurisdictionOverrides
      summary: Avalara CreateJurisdictionOverrides
      description: 'Creates one or more jurisdiction override objects for this account.


        A Jurisdiction Override is a configuration setting that allows you to select the taxing

        jurisdiction for a specific address. If you encounter an address that is on the boundary

        between two different jurisdictions, you can choose to set up a jurisdiction override

        to switch this address to use different taxing jurisdictions.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, BatchServiceAdmin, CSPTester, SSTAdmin, TechnicalSupportAdmin.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                id: 0
                accountId: 0
                description: a test JO
                line1: 5500 Irvine Center Dr
                city: Irvine
                region: CA
                country: US
                postalCode: '92618'
                effectiveDate: '2006-08-01'
                endDate: '2099-01-12'
                jurisdictions:
                - code: '53'
                  name: WASHINGTON
                  type: State
                  rate: 0.06
                  salesRate: 0.06
                  signatureCode: ''
                  region: WA
                  useRate: 0.06
                taxRegionId: 0
                boundaryLevel: Address
                isDefault: false
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: accountId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: postApiV2AccountsByAccountIdJurisdictionoverrides
      x-operation-id-source: derived
    get:
      tags:
      - JurisdictionOverrides
      summary: Avalara ListJurisdictionOverridesByAccount
      description: 'List all jurisdiction override objects defined for this account.


        A Jurisdiction Override is a configuration setting that allows you to select the taxing

        jurisdiction for a specific address. If you encounter an address that is on the boundary

        between two different jurisdictions, you can choose to set up a jurisdiction override

        to switch this address to use different taxing jurisdictions.


        Search for specific objects using the criteria in the `$filter` parameter; full documentation is available on Filtering in REST .

        Paginate your results using the `$top`, `$skip`, and `$orderby` parameters.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPAdmin, CSPTester, SiteAdmin, SSTAdmin, SystemAdmin, TechnicalSupportAdmin, TechnicalSupportUser.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: accountId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiV2AccountsByAccountIdJurisdictionoverrides
      x-operation-id-source: derived
  /api/v2/accounts/{accountId}/jurisdictionoverrides/{id}:
    delete:
      tags:
      - JurisdictionOverrides
      summary: Avalara DeleteJurisdictionOverride
      description: 'Marks the item object at this URL as deleted.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, BatchServiceAdmin, CSPTester, SSTAdmin, TechnicalSupportAdmin.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: accountId
        in: path
        schema:
          type: string
        required: true
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: deleteApiV2AccountsByAccountIdJurisdictionoverridesById
      x-operation-id-source: derived
    get:
      tags:
      - JurisdictionOverrides
      summary: Avalara GetJurisdictionOverride
      description: 'Get the item object identified by this URL.


        A Jurisdiction Override is a configuration setting that allows you to select the taxing

        jurisdiction for a specific address. If you encounter an address that is on the boundary

        between two different jurisdictions, you can choose to set up a jurisdiction override

        to switch this address to use different taxing jurisdictions.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPAdmin, CSPTester, SiteAdmin, SSTAdmin, SystemAdmin, TechnicalSupportAdmin, TechnicalSupportUser.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: accountId
        in: path
        schema:
          type: string
        required: true
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiV2AccountsByAccountIdJurisdictionoverridesById
      x-operation-id-source: derived
    put:
      tags:
      - JurisdictionOverrides
      summary: Avalara UpdateJurisdictionOverride
      description: 'Replace the existing jurisdictionoverride object at this URL with an updated object.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, BatchServiceAdmin, CSPTester, SSTAdmin, TechnicalSupportAdmin.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                id: 0
                accountId: 0
                description: a test JO
                line1: 5500 Irvine Center Dr
                city: Irvine
                region: CA
                country: US
                postalCode: '92618'
                effectiveDate: '2006-08-01'
                endDate: '2099-01-12'
                jurisdictions:
                - code: '53'
                  name: WASHINGTON
                  type: State
                  rate: 0.06
                  salesRate: 0.06
                  signatureCode: ''
                  region: WA
                  useRate: 0.06
                taxRegionId: 0
                boundaryLevel: Address
                isDefault: false
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: accountId
        in: path
        schema:
          type: string
        required: true
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: putApiV2AccountsByAccountIdJurisdictionoverridesById
      x-operation-id-source: derived
  /api/v2/jurisdictionoverrides:
    get:
      tags:
      - JurisdictionOverrides
      summary: Avalara QueryJurisdictionOverrides
      description: 'Get multiple jurisdiction override objects across all companies.


        A Jurisdiction Override is a configuration setting that allows you to select the taxing

        jurisdiction for a specific address. If you encounter an address that is on the boundary

        between two different jurisdictions, you can choose to set up a jurisdiction override

