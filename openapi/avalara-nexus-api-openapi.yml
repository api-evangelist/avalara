          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: getApiV2CompaniesByCompanyIdNexusById
      x-operation-id-source: derived
    put:
      tags:
      - Nexus
      summary: Avalara UpdateNexus
      description: 'Replace the existing nexus declaration object at this URL with an updated object.


        The concept of Nexus indicates a place where your company is legally obligated to collect and remit transactional

        taxes. The legal requirements for nexus may vary per country and per jurisdiction; please seek advice from your

        accountant or lawyer prior to declaring nexus.


        To create a nexus declaration for your company, you must first call the Definitions API `ListNexus` to obtain a

        list of Avalara-defined nexus. Once you have determined which nexus you wish to declare, you should customize

        only the user-selectable fields in this object.


        The user selectable fields for the nexus object are `companyId`, `effectiveDate`, `endDate`, `localNexusTypeId`,

        `taxId`, `nexusTypeId`, `hasPermanentEstablishment`, and `isSellerImporterOfRecord`.


        When calling `CreateNexus` or `UpdateNexus`, all values in your nexus object except for the user-selectable fields

        must match an Avalara-defined system nexus object. You can retrieve a list of Avalara-defined system nexus objects

        by calling `ListNexus`. If any data does not match, AvaTax may not recognize your nexus declaration.


        Please note that nexus changes may not take effect immediately and you should plan to update your nexus settings in advance

        of calculating tax for a location.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, BatchServiceAdmin, CompanyAdmin, CSPTester, SSTAdmin, TechnicalSupportAdmin.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                id: 0
                companyId: 0
                country: US
                region: CA
                jurisTypeId: STA
                jurisdictionTypeId: State
                jurisCode: '06'
                jurisName: CALIFORNIA
                shortName: CA
                signatureCode: ''
                stateAssignedNo: ''
                nexusTypeId: SalesOrSellersUseTax
                hasLocalNexus: true
                hasPermanentEstablishment: true
                streamlinedSalesTax: false
                isSSTActive: false
                createdDate: '2006-10-09T05:55:50.25'
                createdUserId: 0
                modifiedDate: '2018-01-24T03:43:37.31'
                modifiedUserId: 0
                taxTypeGroup: SalesAndUse
                nexusTaxTypeGroup: SalesAndUse
                isSellerImporterOfRecord: false
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: putApiV2CompaniesByCompanyIdNexusById
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
