openapi: 3.2.0
info:
  title: Avalara Nexus API
  version: '1.0'
  description: 'Operations tagged Nexus across 2 of this provider''s published API definitions: avalara-avatax-rest-openapi.yml, avatax-apis-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://rest.avatax.com
  description: AvaTax Production
- url: https://sandbox-rest.avatax.com
  description: AvaTax Sandbox
- url: http://{{baseurl}}
tags:
- name: Nexus
  description: Manage tax nexus declarations for companies
paths:
  /api/v2/companies/{companyId}/nexus:
    get:
      operationId: listNexusByCompany
      summary: Avalara List Nexus for a Company
      description: Retrieves all nexus declarations for the specified company.
      tags:
      - Nexus
      parameters:
      - $ref: '#/components/parameters/companyId'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/top'
      - $ref: '#/components/parameters/skip'
      responses:
        '200':
          description: List of nexus declarations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchResult_NexusModel'
      security:
      - basicAuth: []
      - bearerAuth: []
    post:
      operationId: createNexus
      summary: Avalara Create Nexus for a Company
      tags:
      - Nexus
      parameters:
      - $ref: '#/components/parameters/companyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NexusModel'
      responses:
        '201':
          description: Nexus created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NexusModel'
      security:
      - basicAuth: []
      - bearerAuth: []
    servers:
    - url: https://rest.avatax.com
      description: AvaTax Production
    - url: https://sandbox-rest.avatax.com
      description: AvaTax Sandbox
  /api/v2/companies/{companyId}/nexus/{nexusId}/parameters:
    post:
      tags:
      - Nexus
      summary: Avalara CreateNexusParameters
      description: 'Add parameters to the nexus.

        Some tax calculation and reporting are different depending on the properties of the nexus, such as isRemoteSeller. In AvaTax, these tax-affecting properties are called "parameters".


        A parameter added to an nexus will be used by default in tax calculation but will not show on the transaction line referencing the nexus.


        A parameter specified on a transaction line will override an nexus parameter if they share the same parameter name.


        To see available parameters for this item, call `/api/v2/definitions/parameters?$filter=attributeType eq Nexus`


        Some parameters are only available for use if you have subscribed to specific AvaTax services. To see which parameters you are able to use, add the query parameter "$showSubscribed=true" to the parameter definition call above.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, BatchServiceAdmin, CompanyAdmin, CSPTester, SSTAdmin, TechnicalSupportAdmin.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                id: 0
                name: IsRemoteSeller
                value: 'true'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: nexusId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: postApiV2CompaniesByCompanyIdNexusByNexusIdParameters
      x-operation-id-source: derived
    delete:
      tags:
      - Nexus
      summary: Avalara DeleteNexusParameters
      description: 'Delete all the parameters for a given nexus.

        Some tax calculation and reporting are different depending on the properties of the nexus, such as isRemoteSeller. In AvaTax, these tax-affecting properties are called "parameters".


        A parameter added to an nexus will be used by default in tax calculation but will not show on the transaction line referencing the nexus.


        A parameter specified on a transaction line will override an nexus parameter if they share the same parameter name.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, BatchServiceAdmin, CompanyAdmin, CSPTester, SSTAdmin, TechnicalSupportAdmin.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: nexusId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: deleteApiV2CompaniesByCompanyIdNexusByNexusIdParameters
      x-operation-id-source: derived
    get:
      tags:
      - Nexus
      summary: Avalara ListNexusParameters
      description: 'List parameters for a nexus.

        Some tax calculation and reporting are different depending on the properties of the nexus, such as isRemoteSeller. In AvaTax, these tax-affecting properties are called "parameters".


        A parameter added to an nexus will be used by default in tax calculation but will not show on the transaction line referencing the nexus.


        A parameter specified on a transaction line will override an nexus parameter if they share the same parameter name.


        Search for specific objects using the criteria in the `$filter` parameter; full documentation is available on Filtering in REST .

        Paginate your results using the `$top`, `$skip`, and `$orderby` parameters.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, Compliance Root User, ComplianceAdmin, ComplianceUser, CSPAdmin, CSPTester, FirmAdmin, FirmUser, SiteAdmin, SSTAdmin, SystemAdmin, TechnicalSupportAdmin, TechnicalSupportUser.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: nexusId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: getApiV2CompaniesByCompanyIdNexusByNexusIdParameters
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
  /api/v2/companies/{companyId}/nexus/byaddress:
    post:
      tags:
      - Nexus
      summary: Avalara DeclareNexusByAddress
      description: 'This call is intended to simplify adding all applicable nexus to a company, for an address or addresses. Calling this

        API declares nexus for this company, for the list of addresses provided,

        for the date range provided. You may also use this API to extend effective date on an already-declared nexus.


        The concept of Nexus indicates a place where your company is legally obligated to collect and remit transactional

        taxes. The legal requirements for nexus may vary per country and per jurisdiction; please seek advice from your

        accountant or lawyer prior to declaring nexus.


        Note that not all fields within a nexus can be updated; Avalara publishes a list of all defined nexus at the

        ''/api/v2/definitions/nexus'' endpoint.


        You may only define nexus matching the official list of declared nexus.


        Please note that nexus changes may not take effect immediately and you should plan to update your nexus settings in advance

        of calculating tax for a location.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, BatchServiceAdmin, CompanyAdmin, CSPTester, SSTAdmin, TechnicalSupportAdmin.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                effectiveDate: '2018-01-01T00:00:00'
                endDate: '2020-12-31T00:00:00'
                line1: 2000 Main Street
                city: Irvine
                region: CA
                country: US
                postalCode: '92614'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: postApiV2CompaniesByCompanyIdNexusByaddress
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
