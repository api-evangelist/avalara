components:
  schemas:
    FetchResult_NexusModel:
      type: object
      properties:
        '@recordsetCount':
          type: integer
        value:
          type: array
          items:
            $ref: '#/components/schemas/NexusModel'
    NexusModel:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        country:
          type: string
          description: Two-character ISO 3166 country code
        region:
          type: string
          description: State or province code
