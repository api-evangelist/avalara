openapi: 3.2.0
info:
  title: Avalara Certificates API
  version: '1.0'
  description: 'Operations tagged Certificates across 3 of this provider''s published API definitions: avalara-avatax-rest-openapi.yml, avalara-certcapture-openapi.yml, avatax-apis-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://rest.avatax.com
  description: AvaTax Production
- url: https://sandbox-rest.avatax.com
  description: AvaTax Sandbox
- url: https://api.certcapture.com/v2
  description: CertCapture API Production
- url: http://{{baseurl}}
tags:
- name: Certificates
  description: Manage exemption certificates and CertExpress invitations
paths:
  /api/v2/companies/{companyId}/certificates:
    get:
      operationId: queryCertificates
      summary: Avalara List Certificates for a Company
      description: Retrieves exemption certificates associated with the specified company.
      tags:
      - Certificates
      parameters:
      - $ref: '#/components/parameters/companyId'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/top'
      - $ref: '#/components/parameters/skip'
      responses:
        '200':
          description: List of certificates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchResult_CertificateModel'
      security:
      - basicAuth: []
      - bearerAuth: []
    post:
      operationId: createCertificate
      summary: Avalara Create a New Certificate
      tags:
      - Certificates
      parameters:
      - $ref: '#/components/parameters/companyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CertificateModel'
      responses:
        '201':
          description: Certificate created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificateModel'
      security:
      - basicAuth: []
      - bearerAuth: []
    servers:
    - url: https://rest.avatax.com
      description: AvaTax Production
    - url: https://sandbox-rest.avatax.com
      description: AvaTax Sandbox
  /certificates:
    get:
      operationId: listCertificates
      summary: Avalara List Certificates
      description: Retrieves a filtered list of exemption certificates.
      tags:
      - Certificates
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - Active
          - Expired
          - Revoked
          - Pending
      - name: customerId
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: List of certificates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateListResponse'
      security:
      - basicAuth: []
    post:
      operationId: createCertificate
      summary: Avalara Create a Certificate
      description: Creates a new exemption certificate record.
      tags:
      - Certificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateCreateRequest'
      responses:
        '201':
          description: Certificate created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - basicAuth: []
    servers:
    - url: https://api.certcapture.com/v2
      description: CertCapture API Production
  /certificates/{certificateId}:
    get:
      operationId: getCertificate
      summary: Avalara Get a Certificate
      description: Retrieves a single certificate by its ID.
      tags:
      - Certificates
      parameters:
      - name: certificateId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Certificate details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - basicAuth: []
    put:
      operationId: updateCertificate
      summary: Avalara Update a Certificate
      tags:
      - Certificates
      parameters:
      - name: certificateId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateCreateRequest'
      responses:
        '200':
          description: Certificate updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
      security:
      - basicAuth: []
    delete:
      operationId: deleteCertificate
      summary: Avalara Delete a Certificate
      tags:
      - Certificates
      parameters:
      - name: certificateId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Certificate deleted
      security:
      - basicAuth: []
    servers:
    - url: https://api.certcapture.com/v2
      description: CertCapture API Production
  /certificates/{certificateId}/attachment:
    get:
      operationId: getCertificateAttachment
      summary: Avalara Download Certificate Attachment
      description: Downloads the PDF or image attachment for a certificate.
      tags:
      - Certificates
      parameters:
      - name: certificateId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Certificate attachment
          content:
            application/pdf:
              schema:
                type: string
                format: binary
      security:
      - basicAuth: []
    post:
      operationId: uploadCertificateAttachment
      summary: Avalara Upload Certificate Attachment
      tags:
      - Certificates
      parameters:
      - name: certificateId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Attachment uploaded
      security:
      - basicAuth: []
    servers:
    - url: https://api.certcapture.com/v2
      description: CertCapture API Production
  /api/v2/companies/{companyId}/certificates/{id}:
    delete:
      tags:
      - Certificates
      summary: Avalara DeleteCertificate
      description: 'Revoke the certificate identified by this URL, then delete it.


        A certificate is a document stored in either AvaTax Exemptions or CertCapture. The certificate document

        can contain information about a customer''s eligibility for exemption from sales or use taxes based on

        criteria you specify when you store the certificate. To view or manage your certificates directly, please

        log onto the administrative website for the product you purchased.


        Revoked certificates can no longer be used.


        Before you can use any exemption certificates endpoints, you must set up your company for exemption certificate data storage.

        Companies that do not have this storage system set up will see `CertCaptureNotConfiguredError` when they call exemption

        certificate related APIs. To check if this is set up for a company, call `GetCertificateSetup`. To request setup of exemption

        certificate storage for this company, call `RequestCertificateSetup`.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: deleteApiV2CompaniesByCompanyIdCertificatesById
      x-operation-id-source: derived
    get:
      tags:
      - Certificates
      summary: Avalara GetCertificate
      description: 'Get the current certificate identified by this URL.


        A certificate is a document stored in either AvaTax Exemptions or CertCapture. The certificate document

        can contain information about a customer''s eligibility for exemption from sales or use taxes based on

        criteria you specify when you store the certificate. To view or manage your certificates directly, please

        log onto the administrative website for the product you purchased.


        You can use the `$include` parameter to fetch the following additional objects for expansion:


        * customers - Retrieves the list of customers linked to the certificate.

        * po_numbers - Retrieves all PO numbers tied to the certificate.

        * attributes - Retrieves all attributes applied to the certificate.


        Before you can use any exemption certificates endpoints, you must set up your company for exemption certificate data storage.

        Companies that do not have this storage system set up will see `CertCaptureNotConfiguredError` when they call exemption

        certificate related APIs. To check if this is set up for a company, call `GetCertificateSetup`. To request setup of exemption

        certificate storage for this company, call `RequestCertificateSetup`.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin, TechnicalSupportUser.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: getApiV2CompaniesByCompanyIdCertificatesById
      x-operation-id-source: derived
    put:
      tags:
      - Certificates
      summary: Avalara UpdateCertificate
      description: 'Replace the certificate identified by this URL with a new one.


        A certificate is a document stored in either AvaTax Exemptions or CertCapture. The certificate document

        can contain information about a customer''s eligibility for exemption from sales or use taxes based on

        criteria you specify when you store the certificate. To view or manage your certificates directly, please

        log onto the administrative website for the product you purchased.


        Before you can use any exemption certificates endpoints, you must set up your company for exemption certificate data storage.

        Companies that do not have this storage system set up will see `CertCaptureNotConfiguredError` when they call exemption

        certificate related APIs. To check if this is set up for a company, call `GetCertificateSetup`. To request setup of exemption

        certificate storage for this company, call `RequestCertificateSetup`.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                id: 0
                signedDate: '2016-02-01'
                expirationDate: '2020-12-31'
                filename: 2bd5e599-b0ed-4d6c-8a95-306ea9217561
                documentExists: false
                valid: true
                verified: false
                exemptPercentage: 0
                isSingleCertificate: false
                exemptionNumber: Exempt-1234
                exemptionReason:
                  name: RESALE
                createdDate: '2023-08-13T01:16:17.2575898Z'
                modifiedDate: '2023-08-13'
                taxNumberType: FEIN
                businessNumberType: Business Services
                pageCount: 0
                customers:
                - companyId: 0
                  customerCode: a5b89cd8-e54f-4525-bc1a-7956db8c8e91
                  alternateId: '987654321'
                  name: Dr. Bob Example
                  attnName: 'Attn: Receiving'
                  line1: 645 Main Street
                  city: Irvine
                  postalCode: '92614'
                  phoneNumber: (949) 555-1212
                  faxNumber: 949.555.1213
                  emailAddress: dr.bob.example@example.org
                  contactName: Alice Smith
                  lastTransaction: '2008-10-08T00:00:00'
                  country: US
                  region: CA
                  exposureZones:
                  - name: Washington
                - companyId: 0
                  customerCode: fdf91d9e-9c67-4792-a484-c67b38838bde
                  alternateId: '987654321'
                  name: Dr. Bob Example
                  attnName: 'Attn: Receiving'
                  line1: 645 Main Street
                  city: Irvine
                  postalCode: '92614'
                  phoneNumber: (949) 555-1212
                  faxNumber: 949.555.1213
                  emailAddress: dr.bob.example@example.org
                  contactName: Alice Smith
                  lastTransaction: '2008-10-08T00:00:00'
                  country: US
                  region: CA
                  exposureZones:
                  - name: Washington
                exposureZone:
                  name: Washington
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: putApiV2CompaniesByCompanyIdCertificatesById
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
  /api/v2/companies/{companyId}/certificates/{id}/attachment:
    get:
      tags:
      - Certificates
      summary: Avalara DownloadCertificateImage
      description: 'Download an image or PDF file for this certificate.


        This API can be used to download either a single-page preview of the certificate or a full PDF document.

        To retrieve a preview image, set the `$type` parameter to `Jpeg` and the `$page` parameter to `1`.


        A certificate is a document stored in either AvaTax Exemptions or CertCapture. The certificate document

        can contain information about a customer''s eligibility for exemption from sales or use taxes based on

        criteria you specify when you store the certificate. To view or manage your certificates directly, please

        log onto the administrative website for the product you purchased.


        Before you can use any exemption certificates endpoints, you must set up your company for exemption certificate data storage.

        Companies that do not have this storage system set up will see `CertCaptureNotConfiguredError` when they call exemption

        certificate related APIs. To check if this is set up for a company, call `GetCertificateSetup`. To request setup of exemption

        certificate storage for this company, call `RequestCertificateSetup`.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin, TechnicalSupportUser.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: getApiV2CompaniesByCompanyIdCertificatesByIdAttachment
      x-operation-id-source: derived
    post:
      tags:
      - Certificates
      summary: Avalara UploadCertificateImage
      description: 'Upload an image or PDF attachment for this certificate.


        Image attachments can be of the format `PDF`, `JPEG`, `TIFF`, or `PNG`. To upload a multi-page image, please

        use the `PDF` data type.


        A certificate is a document stored in either AvaTax Exemptions or CertCapture. The certificate document

        can contain information about a customer''s eligibility for exemption from sales or use taxes based on

        criteria you specify when you store the certificate. To view or manage your certificates directly, please

        log onto the administrative website for the product you purchased.


        Before you can use any exemption certificates endpoints, you must set up your company for exemption certificate data storage.

        Companies that do not have this storage system set up will see `CertCaptureNotConfiguredError` when they call exemption

        certificate related APIs. To check if this is set up for a company, call `GetCertificateSetup`. To request setup of exemption

        certificate storage for this company, call `RequestCertificateSetup`.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin, TechnicalSupportUser.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example: ''
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: postApiV2CompaniesByCompanyIdCertificatesByIdAttachment
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
  /api/v2/companies/{companyId}/certificates/setup:
    get:
      tags:
      - Certificates
      summary: Avalara GetCertificateSetup
      description: 'Checks whether this company is configured to use exemption certificates in AvaTax.


        Exemption certificates are tracked through a different auditable data store than the one that

        holds AvaTax transactions. To use the AvaTax exemption certificate document store, please call

        `GetCertificateSetup` to see if your company is configured to use the exemption certificate

        document store. To request setup, please call `RequestCertificateSetup` and your company will

        be configured with data storage in the auditable certificate system.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin, TechnicalSupportUser.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: getApiV2CompaniesByCompanyIdCertificatesSetup
      x-operation-id-source: derived
    post:
      tags:
      - Certificates
      summary: Avalara RequestCertificateSetup
      description: 'Requests the setup of exemption certificates for this company.


        Exemption certificates are tracked through a different auditable data store than the one that

        holds AvaTax transactions. To use the AvaTax exemption certificate document store, please call

        `GetCertificateSetup` to see if your company is configured to use the exemption certificate

        document store. To request setup, please call `RequestCertificateSetup` and your company will

        be configured with data storage in the auditable certificate system.


        This API will return the current status of exemption certificate setup for this company.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin, TechnicalSupportUser.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example: ''
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: postApiV2CompaniesByCompanyIdCertificatesSetup
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
  /api/v2/companies/{companyId}/certificates/{id}/attributes/link:
    post:
      tags:
      - Certificates
      summary: Avalara LinkAttributesToCertificate
      description: 'Link one or many attributes to a certificate.


        A certificate may have multiple attributes that control its behavior. You may link or unlink attributes to a

        certificate at any time. The full list of defined attributes may be found using `ListCertificateAttributes`.


        A certificate is a document stored in either AvaTax Exemptions or CertCapture. The certificate document

        can contain information about a customer''s eligibility for exemption from sales or use taxes based on

        criteria you specify when you store the certificate. To view or manage your certificates directly, please

        log onto the administrative website for the product you purchased.


        Before you can use any exemption certificates endpoints, you must set up your company for exemption certificate data storage.

        Companies that do not have this storage system set up will see `CertCaptureNotConfiguredError` when they call exemption

        certificate related APIs. To check if this is set up for a company, call `GetCertificateSetup`. To request setup of exemption

        certificate storage for this company, call `RequestCertificateSetup`.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                id: 0
                name: DIRECT PAY
                isSystemCode: false
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: postApiV2CompaniesByCompanyIdCertificatesByIdAttributesLink
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
  /api/v2/companies/{companyId}/certificates/{id}/customers/link:
    post:
      tags:
      - Certificates
      summary: Avalara LinkCustomersToCertificate
      description: 'Link one or more customers to an existing certificate.


        Customers and certificates must be linked before a customer can make use of a certificate to obtain

        a tax exemption in AvaTax. Since some certificates may cover more than one business entity, a certificate

        can be connected to multiple customer records using the `LinkCustomersToCertificate` API.


        A certificate is a document stored in either AvaTax Exemptions or CertCapture. The certificate document

        can contain information about a customer''s eligibility for exemption from sales or use taxes based on

        criteria you specify when you store the certificate. To view or manage your certificates directly, please

        log onto the administrative website for the product you purchased.


        Before you can use any exemption certificates endpoints, you must set up your company for exemption certificate data storage.

        Companies that do not have this storage system set up will see `CertCaptureNotConfiguredError` when they call exemption

        certificate related APIs. To check if this is set up for a company, call `GetCertificateSetup`. To request setup of exemption

        certificate storage for this company, call `RequestCertificateSetup`.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                customers:
                - '123456789'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: postApiV2CompaniesByCompanyIdCertificatesByIdCustomersLink
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
  /api/v2/companies/{companyId}/certificates/{id}/attributes:
    get:
      tags:
      - Certificates
      summary: Avalara ListAttributesForCertificate
      description: 'Retrieve the list of attributes that are linked to this certificate.


