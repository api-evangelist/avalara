      - basicAuth: []
      operationId: getApiV2CompaniesByCompanyIdCustomersByCustomerCodeCertificates
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
  /api/v2/companies/{companyId}/customers/{customerCode}/certificates/{country}/{region}:
    get:
      tags:
      - Customers
      summary: Avalara ListValidCertificatesForCustomer
      description: 'List valid certificates linked to a customer in a particular country and region.


        This API is intended to help identify whether a customer has already provided a certificate that

        applies to a particular country and region. This API is intended to help you remind a customer

        when they have or have not provided copies of their exemption certificates to you during the sales

        order process.


        If a customer does not have a certificate on file and they wish to provide one, you should send the customer

        a CertExpress invitation link so that the customer can upload proof of their exemption certificate. Please

        see the `CreateCertExpressInvitation` API to create an invitation link for this customer.


        Before you can use any exemption certificates endpoints, you must set up your company for exemption certificate data storage.

        Companies that do not have this storage system set up will see `CertCaptureNotConfiguredError` when they call exemption

        certificate related APIs. To check if this is set up for a company, call `GetCertificateSetup`. To request setup of exemption

        certificate storage for this company, call `RequestCertificateSetup`.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin, TechnicalSupportUser.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: customerCode
        in: path
        schema:
          type: string
        required: true
      - name: country
        in: path
        schema:
