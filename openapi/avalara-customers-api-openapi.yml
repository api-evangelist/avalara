        Before you can use any exemption certificates endpoints, you must set up your company for exemption certificate data storage.

        Companies that do not have this storage system set up will see `CertCaptureNotConfiguredError` when they call exemption

        certificate related APIs. To check if this is set up for a company, call `GetCertificateSetup`. To request setup of exemption

        certificate storage for this company, call `RequestCertificateSetup`.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin, TechnicalSupportUser.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                certificates:
                - 1
                - 3
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: customerCode
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: postApiV2CompaniesByCompanyIdCustomersByCustomerCodeCertificatesLink
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
  /api/v2/companies/{companyId}/customers/billto/{code}/shipto/link:
    post:
      tags:
      - Customers
      summary: Avalara LinkShipToCustomersToBillCustomer
      description: 'Links a Ship-To customer record with a Bill-To customer record.


        Customer records represent businesses or individuals who can provide exemption certificates. Some customers

        may have certificates that are linked to their shipping address or their billing address. To group these

        customer records together, you may link multiple bill-to and ship-to addresses together to represent a single

        entity that has multiple different addresses of different kinds.


        In general, a customer will have only one primary billing address and multiple ship-to addresses, representing

        all of the different locations where they receive goods. To facilitate this type of customer, you can send in

        one bill-to customer code and multiple ship-to customer codes in a single API call.


        Note that you can only link a ship-to customer record to a bill-to customer record. You may not link two customers

        of the same kind together.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin, TechnicalSupportUser.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                customers:
                - '123456789'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: code
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: postApiV2CompaniesByCompanyIdCustomersBilltoByCodeShiptoLink
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
  /api/v2/companies/{companyId}/customers/{customerCode}/attributes:
    get:
      tags:
      - Customers
      summary: Avalara ListAttributesForCustomer
      description: 'Retrieve the attributes linked to the customer identified by this URL.


        A customer may have multiple attributes that control its behavior. You may link or unlink attributes to a

        customer at any time. The full list of defined attributes may be found using `QueryCompanyCustomerAttributes` API.


        A customer object defines information about a person or business that purchases products from your

