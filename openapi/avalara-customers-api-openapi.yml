        Companies that do not have this storage system set up will see `CertCaptureNotConfiguredError` when they call exemption

        certificate related APIs. To check if this is set up for a company, call `GetCertificateSetup`. To request setup of exemption

        certificate storage for this company, call `RequestCertificateSetup`.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin, TechnicalSupportUser.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: customerCode
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: getApiV2CompaniesByCompanyIdCustomersByCustomerCodeAttributes
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
  /api/v2/companies/{companyId}/customers/{customerCode}/certificates:
    get:
      tags:
      - Customers
      summary: Avalara ListCertificatesForCustomer
      description: 'List all certificates linked to a customer.


        A customer object defines information about a person or business that purchases products from your

        company. When you create a tax transaction in AvaTax, you can use the `customerCode` from this

        record in your `CreateTransaction` API call. AvaTax will search for this `customerCode` value and

