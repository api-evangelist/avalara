        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                id: 1
                name: ADDRESS CHANGE NEEDED
                description: Customer address change is needed.
                isSystemCode: false
                isNonDeliver: true
                isChangeable: true
      parameters:
