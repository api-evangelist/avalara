openapi: 3.2.0
info:
  title: Avalara Customers API
  version: '1.0'
  description: 'Operations tagged Customers across 3 of this provider''s published API definitions: avalara-avatax-rest-openapi.yml, avalara-certcapture-openapi.yml, avatax-apis-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://rest.avatax.com
  description: AvaTax Production
- url: https://sandbox-rest.avatax.com
  description: AvaTax Sandbox
- url: https://api.certcapture.com/v2
  description: CertCapture API Production
- url: http://{{baseurl}}
tags:
- name: Customers
  description: Manage customer records and their certificate associations
paths:
  /api/v2/companies/{companyId}/customers:
    get:
      operationId: queryCustomers
      summary: Avalara List Customers for a Company
      tags:
      - Customers
      parameters:
      - $ref: '#/components/parameters/companyId'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/top'
      - $ref: '#/components/parameters/skip'
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchResult_CustomerModel'
      security:
      - basicAuth: []
      - bearerAuth: []
    post:
      operationId: createCustomer
      summary: Avalara Create a New Customer
      tags:
      - Customers
      parameters:
      - $ref: '#/components/parameters/companyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CustomerModel'
      responses:
        '201':
          description: Customer created
      security:
      - basicAuth: []
      - bearerAuth: []
    servers:
    - url: https://rest.avatax.com
      description: AvaTax Production
    - url: https://sandbox-rest.avatax.com
      description: AvaTax Sandbox
  /customers:
    get:
      operationId: listCustomers
      summary: Avalara List Customers
      tags:
      - Customers
      parameters:
      - name: page
        in: query
        schema:
          type: integer
      - name: pageSize
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
      security:
      - basicAuth: []
    post:
      operationId: createCustomer
      summary: Avalara Create a Customer
      tags:
      - Customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertCaptureCustomer'
      responses:
        '201':
          description: Customer created
      security:
      - basicAuth: []
    servers:
    - url: https://api.certcapture.com/v2
      description: CertCapture API Production
  /customers/{customerId}:
    get:
      operationId: getCustomer
      summary: Avalara Get a Customer by ID
      tags:
      - Customers
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Customer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertCaptureCustomer'
      security:
      - basicAuth: []
    put:
      operationId: updateCustomer
      summary: Avalara Update a Customer
      tags:
      - Customers
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertCaptureCustomer'
      responses:
        '200':
          description: Customer updated
      security:
      - basicAuth: []
    servers:
    - url: https://api.certcapture.com/v2
      description: CertCapture API Production
  /customers/{customerId}/certificates:
    get:
      operationId: getCustomerCertificates
      summary: Avalara List Certificates for a Customer
      tags:
      - Customers
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of customer certificates
      security:
      - basicAuth: []
    servers:
    - url: https://api.certcapture.com/v2
      description: CertCapture API Production
  /api/v2/companies/{companyId}/customers/{customerCode}:
    delete:
      tags:
      - Customers
      summary: Avalara DeleteCustomer
      description: 'Deletes the customer object referenced by this URL.


        A customer object defines information about a person or business that purchases products from your

        company. When you create a tax transaction in AvaTax, you can use the `customerCode` from this

        record in your `CreateTransaction` API call. AvaTax will search for this `customerCode` value and

        identify any certificates linked to this `customer` object. If any certificate applies to the transaction,

        AvaTax will record the appropriate elements of the transaction as exempt and link it to the `certificate`.


        Before you can use any exemption certificates endpoints, you must set up your company for exemption certificate data storage.

        Companies that do not have this storage system set up will see `CertCaptureNotConfiguredError` when they call exemption

        certificate related APIs. To check if this is set up for a company, call `GetCertificateSetup`. To request setup of exemption

        certificate storage for this company, call `RequestCertificateSetup`.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: customerCode
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: deleteApiV2CompaniesByCompanyIdCustomersByCustomerCode
      x-operation-id-source: derived
    get:
      tags:
      - Customers
      summary: Avalara GetCustomer
      description: 'Retrieve the customer identified by this URL.


        A customer object defines information about a person or business that purchases products from your

        company. When you create a tax transaction in AvaTax, you can use the `customerCode` from this

        record in your `CreateTransaction` API call. AvaTax will search for this `customerCode` value and

        identify any certificates linked to this customer object. If any certificate applies to the transaction,

        AvaTax will record the appropriate elements of the transaction as exempt and link it to the `certificate`.


        You can use the `$include` parameter to fetch the following additional objects for expansion:


        * Certificates - Fetch a list of certificates linked to this customer.

        * CustomFields - Fetch a list of custom fields associated to this customer.

        * attributes - Retrieves all attributes applied to the customer.


        Before you can use any exemption certificates endpoints, you must set up your company for exemption certificate data storage.

        Companies that do not have this storage system set up will see `CertCaptureNotConfiguredError` when they call exemption

        certificate related APIs. To check if this is set up for a company, call `GetCertificateSetup`. To request setup of exemption

        certificate storage for this company, call `RequestCertificateSetup`.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin, TechnicalSupportUser.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: customerCode
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: getApiV2CompaniesByCompanyIdCustomersByCustomerCode
      x-operation-id-source: derived
    put:
      tags:
      - Customers
      summary: Avalara UpdateCustomer
      description: 'Replace the customer object at this URL with a new record.


        A customer object defines information about a person or business that purchases products from your

        company. When you create a tax transaction in AvaTax, you can use the `customerCode` from this

        record in your `CreateTransaction` API call. AvaTax will search for this `customerCode` value and

        identify any certificates linked to this `customer` object. If any certificate applies to the transaction,

        AvaTax will record the appropriate elements of the transaction as exempt and link it to the `certificate`.


        Before you can use any exemption certificates endpoints, you must set up your company for exemption certificate data storage.

        Companies that do not have this storage system set up will see `CertCaptureNotConfiguredError` when they call exemption

        certificate related APIs. To check if this is set up for a company, call `GetCertificateSetup`. To request setup of exemption

        certificate storage for this company, call `RequestCertificateSetup`.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                companyId: 0
                customerCode: ae304e4c-9926-4ab3-8a12-267a59c05cd5
                alternateId: '987654321'
                name: Dr. Bob Example
                attnName: 'Attn: Receiving'
                line1: 645 Main Street
                city: Irvine
                postalCode: '92614'
                phoneNumber: (949) 555-1212
                faxNumber: 949.555.1213
                emailAddress: dr.bob.example@example.org
                contactName: Alice Smith
                lastTransaction: '2008-10-08T00:00:00'
                country: US
                region: CA
                exposureZones:
                - name: Washington
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: customerCode
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: putApiV2CompaniesByCompanyIdCustomersByCustomerCode
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
  /api/v2/companies/{companyId}/customers/{customerCode}/attributes/link:
    put:
      tags:
      - Customers
      summary: Avalara LinkAttributesToCustomer
      description: 'Link one or many attributes to a customer.


        A customer may have multiple attributes that control its behavior. You may link or unlink attributes to a

        customer at any time. The full list of defined attributes may be found using `QueryCompanyCustomerAttributes` API.


        A customer object defines information about a person or business that purchases products from your

        company. When you create a tax transaction in AvaTax, you can use the `customerCode` from this

        record in your `CreateTransaction` API call. AvaTax will search for this `customerCode` value and

        identify any certificates linked to this customer object. If any certificate applies to the transaction,

        AvaTax will record the appropriate elements of the transaction as exempt and link it to the `certificate`.


        Before you can use any exemption certificates endpoints, you must set up your company for exemption certificate data storage.

        Companies that do not have this storage system set up will see `CertCaptureNotConfiguredError` when they call exemption

        certificate related APIs. To check if this is set up for a company, call `GetCertificateSetup`. To request setup of exemption

        certificate storage for this company, call `RequestCertificateSetup`.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                id: 1
                name: ADDRESS CHANGE NEEDED
                description: Customer address change is needed.
                isSystemCode: false
                isNonDeliver: true
                isChangeable: true
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: customerCode
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security:
      - basicAuth: []
      operationId: putApiV2CompaniesByCompanyIdCustomersByCustomerCodeAttributesLink
      x-operation-id-source: derived
    servers:
    - url: http://{{baseurl}}
  /api/v2/companies/{companyId}/customers/{customerCode}/certificates/link:
    post:
      tags:
      - Customers
      summary: Avalara LinkCertificatesToCustomer
      description: 'Link one or more certificates to a customer.


        A customer object defines information about a person or business that purchases products from your

        company. When you create a tax transaction in AvaTax, you can use the `customerCode` from this

        record in your `CreateTransaction` API call. AvaTax will search for this `customerCode` value and

        identify any certificates linked to this `customer` object. If any certificate applies to the transaction,

