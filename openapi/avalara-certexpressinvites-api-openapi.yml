openapi: 3.2.0
info:
  title: Avalara AvaTax Cert Express Invites API
  description: Welcome to the AvaTax API Postman Collection!
  version: 1.0.0
servers:
- url: http://{{baseurl}}
security:
- basicAuth: []
tags:
- name: CertExpressInvites
paths:
  /api/v2/companies/{companyId}/customers/{customerCode}/certexpressinvites:
    post:
      tags:
      - CertExpressInvites
      summary: Avalara CreateCertExpressInvitation
      description: 'Creates an invitation for a customer to self-report certificates using the CertExpress website.


        This invitation is delivered by your choice of method, or you can present a hyperlink to the user

        directly in your connector. Your customer will be redirected to https://app.certexpress.com/ where

        they can follow a step-by-step guide to enter information about their exemption certificates. The

        certificates entered will be recorded and automatically linked to their customer record.


        The CertExpress website is available for customers to use at any time.

        Using CertExpress with this API will ensure that your certificates are automatically linked correctly into

        your company so that they can be used for tax exemptions.


        Before you can use any exemption certificates endpoints, you must set up your company for exemption certificate data storage.

        Companies that do not have this storage system set up will see `CertCaptureNotConfiguredError` when they call exemption

        certificate related APIs. To check if this is set up for a company, call `GetCertificateSetup`. To request setup of exemption

        certificate storage for this company, call `RequestCertificateSetup`.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                recipient: bob@example.org
                coverLetterTitle: STANDARD_REQUEST
                exposureZones:
                - 89
                exemptReasons:
                - 70
                deliveryMethod: Download
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: customerCode
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: postApiV2CompaniesByCompanyIdCustomersByCustomerCodeCertexpressinvites
      x-operation-id-source: derived
  /api/v2/companies/{companyId}/customers/{customerCode}/certexpressinvites/{id}:
    get:
      tags:
      - CertExpressInvites
      summary: Avalara GetCertExpressInvitation
      description: 'Retrieve an existing CertExpress invitation sent to a customer.


        A CertExpression invitation allows a customer to follow a helpful step-by-step guide to provide information

        about their certificates. This step by step guide allows the customer to complete and upload the full

        certificate in a convenient, friendly web browser experience. When the customer completes their certificates,

        they will automatically be recorded to your company and linked to the customer record.


        The CertExpress website is available for customers to use at any time.

        Using CertExpress with this API will ensure that your certificates are automatically linked correctly into

        your company so that they can be used for tax exemptions.


        Before you can use any exemption certificates endpoints, you must set up your company for exemption certificate data storage.

        Companies that do not have this storage system set up will see `CertCaptureNotConfiguredError` when they call exemption

        certificate related APIs. To check if this is set up for a company, call `GetCertificateSetup`. To request setup of exemption

        certificate storage for this company, call `RequestCertificateSetup`.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin, TechnicalSupportUser.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      - name: customerCode
        in: path
        schema:
          type: string
        required: true
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiV2CompaniesByCompanyIdCustomersByCustomerCodeCertexpressinvitesById
      x-operation-id-source: derived
  /api/v2/companies/{companyId}/certexpressinvites:
    get:
      tags:
      - CertExpressInvites
      summary: Avalara ListCertExpressInvitations
      description: 'Retrieve CertExpress invitations sent by this company.


        A CertExpression invitation allows a customer to follow a helpful step-by-step guide to provide information

        about their certificates. This step by step guide allows the customer to complete and upload the full

        certificate in a convenient, friendly web browser experience. When the customer completes their certificates,

        they will automatically be recorded to your company and linked to the customer record.


        The CertExpress website is available for customers to use at any time.

        Using CertExpress with this API will ensure that your certificates are automatically linked correctly into

        your company so that they can be used for tax exemptions.


        Before you can use any exemption certificates endpoints, you must set up your company for exemption certificate data storage.

        Companies that do not have this storage system set up will see `CertCaptureNotConfiguredError` when they call exemption

        certificate related APIs. To check if this is set up for a company, call `GetCertificateSetup`. To request setup of exemption

        certificate storage for this company, call `RequestCertificateSetup`.


        ### Security Policies


        * This API requires one of the following user roles: AccountAdmin, AccountOperator, AccountUser, BatchServiceAdmin, CompanyAdmin, CompanyUser, CSPTester, SSTAdmin, TechnicalSupportAdmin, TechnicalSupportUser.

        * This API depends on the following active services:*Required* (all): AvaTaxPro.'
      parameters:
      - name: X-Avalara-Client
        in: header
        schema:
          type: string
        description: Identifies the software you are using to call this API. For more information on the client header, see [Client Headers](https://developer.avalara.com/avatax/client-headers/).
        example: AvaTax Postman Collection
      - name: companyId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: getApiV2CompaniesByCompanyIdCertexpressinvites
      x-operation-id-source: derived
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
